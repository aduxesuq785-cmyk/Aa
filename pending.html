    <script>
        // 🔐 লগইন পাহারা। আগে শুধু  window.location.href = 'login.html'  ছিল —
        //    ওটা স্ক্রিপ্ট থামায় না, তাই লগআউট অবস্থাতেও নিচের কোড চলত।
        if (window.SBD) { SBD.requireLogin(); }
        else if (localStorage.getItem('isLoggedIn') !== 'true') { window.location.replace('login.html'); }
        
        // ব্যান চেক ফাংশন
        function isUserBanned() {
            let userTelegramId = localStorage.getItem('userTelegramId');
            let users = JSON.parse(localStorage.getItem('systemUsers')) || [];
            let currentUser = users.find(u => u.telegramId == userTelegramId);
            return currentUser && currentUser.status === 'banned';
        }
        
        // ব্যান্ড ইউজারকে রিডাইরেক্ট
        if(isUserBanned()) {
            alert("❌ Your account is banned! You cannot view deposits.");
            window.location.href = 'index.html';
        }
    </script>
    <style>

        /* Toast */

        .toast-success { background: #00f2fe; color: #090910; }

        /* SUPPORT MODAL CSS */

<body>

    <script>
        // Header & Nav JS (Modal)
        function openSupportModal(e) { if(e) e.preventDefault(); document.getElementById('supportModal').style.display = 'flex'; }
        function closeSupportModal() { document.getElementById('supportModal').style.display = 'none'; }
        window.onclick = function(event) { if (event.target === document.getElementById('supportModal')) closeSupportModal(); }
        


        // Original Pending/Deposit JS
        let isLoading = false;
        const BALANCE_API = 'api_balance.php';
        
        function showToast(message, type) {
            let toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(function() {
                if(toast.parentNode) toast.parentNode.removeChild(toast);
            }, 2000);
        }
        
        // ========== লাইভ ব্যালেন্স লোড ==========
        async function loadUserBalance() {
            let userTelegramId = localStorage.getItem('userTelegramId');
            const wallet = document.getElementById('walletDisplay');
            if(!userTelegramId) {
                if (wallet) wallet.innerHTML = '$0.00';
                return;
            }
            const cacheKey = 'balance:' + userTelegramId;
            const paint = (value) => {
                if (wallet) wallet.innerHTML = '$' + parseFloat(value || 0).toFixed(2);
            };
            if (window.SBD && SBD.cacheGet) {
                const cached = SBD.cacheGet(cacheKey, true);
                if (cached && cached.success) paint(cached.balance);
            }
            try {
                const response = await fetch(`${BALANCE_API}?telegram_id=${userTelegramId}`);
                const data = await response.json();
                if(data.success) {
                    paint(data.balance);
                    if (window.SBD && SBD.cacheSet) SBD.cacheSet(cacheKey, data, 5 * 60 * 1000);
                }
            } catch(e) { 
                console.log("Balance load error:", e);
                let wallets = JSON.parse(localStorage.getItem('userWallets')) || {};
                let balance = (userTelegramId && wallets['tg_' + userTelegramId]) ? wallets['tg_' + userTelegramId].balance : 0;
                // Prefer a previously painted cache; legacy userWallets remains a
                // fallback for installations that predate the shared cache.
                if (!(window.SBD && SBD.cacheGet && SBD.cacheGet(cacheKey, true))) paint(balance);
            }
        }
        
        function loadUserDeposits() {
            if(isLoading) return;
            isLoading = true;
            
            var userTelegramId = localStorage.getItem('userTelegramId');
            var userEmail = localStorage.getItem('userEmail');
            
            if(!userTelegramId && !userEmail) {
                isLoading = false;
                document.getElementById('depositsContainer').innerHTML = '<div class="empty-state"><i class="fa-solid fa-user-slash"></i><br><h3>No User Found</h3><p>Please login again.</p></div>';
                return;
            }
            
            var postData = {};
            if(userTelegramId) postData.user_id = userTelegramId;
            if(userEmail) postData.email = userEmail;

            var cacheKey = 'deposits:' + (userTelegramId || userEmail);
            var renderDeposits = function(data) {
                var container = document.getElementById('depositsContainer');
                if(!container) return;
                if(!data || data.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-box-open"></i><br><h3>No Recent Deposits</h3><p>Your deposit history will appear here.</p></div>';
                    return;
                }
                var html = '';
                for(var i = 0; i < data.length; i++) {
                    var dep = data[i], statusClass = '', statusText = '', reasonHtml = '';
                    if(dep.status === 'Pending' || dep.status === 'Pending Verification') {
                        statusClass = 'status-pending'; statusText = '<i class="fa-solid fa-hourglass-half"></i> Pending';
                    } else if(dep.status === 'Approved') {
                        statusClass = 'status-approved'; statusText = '<i class="fa-solid fa-check-circle"></i> Approved';
                    } else if(dep.status === 'Rejected') {
                        statusClass = 'status-rejected'; statusText = '<i class="fa-solid fa-times-circle"></i> Rejected';
                        if(dep.admin_note || dep.rejectReason) reasonHtml = '<div class="reason-box"><i class="fa-solid fa-circle-exclamation"></i> <strong>Reason:</strong> ' + (dep.admin_note || dep.rejectReason) + '</div>';
                    }
                    var amountDisplay = dep.amount_display || dep.amount;
                    var trxid = dep.trxid || dep.trx;
                    var date = dep.created_at || dep.date;
                    html += '<div class="deposit-card">';
                    html += '<span class="status-badge ' + statusClass + '">' + statusText + '</span>';
                    html += '<div><strong>🆔 ID:</strong> ' + dep.id + '</div>';
                    html += '<div><strong>💳 Method:</strong> ' + dep.method + '</div>';
                    html += '<div><strong>💰 Amount:</strong> <span style="color:#00f2fe; font-weight:bold;">' + amountDisplay + '</span></div>';
                    html += '<div><strong>🔢 TrxID:</strong> <code>' + trxid + '</code></div>';
                    html += '<div><strong>📅 Date:</strong> <span style="color:#94a3b8;">' + date + '</span></div>';
                    html += reasonHtml + '</div>';
                }
                container.innerHTML = html;
            };
            if (window.SBD && SBD.cacheGet) {
                var cachedDeposits = SBD.cacheGet(cacheKey, true);
                if (cachedDeposits) renderDeposits(cachedDeposits);
            }
            
            fetch('api_user_deposits.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(postData)
            })
            .then(function(res) {
                return res.json();
            })
            .then(function(data) {
                isLoading = false;
                console.log("Deposits received:", data);
                renderDeposits(data);
                if (window.SBD && SBD.cacheSet) SBD.cacheSet(cacheKey, data, 5 * 60 * 1000);
            })
            .catch(function(err) {
                isLoading = false;
                console.error("API Error:", err);
                var container = document.getElementById('depositsContainer');
                var cached = window.SBD && SBD.cacheGet ? SBD.cacheGet(cacheKey, true) : null;
                if(!cached && container.innerHTML.indexOf('Connection Error') === -1) {
                    container.innerHTML = '<div class="empty-state" style="border-color: #ff0844;"><i class="fa-solid fa-triangle-exclamation" style="color: #ff0844;"></i><br><h3 style="color:#e2e8f0;">Connection Error</h3><p>Failed to load deposit history.</p></div>';
                }
            });
        }
        
        // স্টোরেজ ইভেন্ট
        window.addEventListener('storage', function(e) {
            if(e.key === 'userWallets' || e.key === 'deposit_updated') {
                console.log("Storage changed, refreshing deposits...");
                loadUserDeposits();
            }
        });
        
        // পেজ লোড
        loadUserDeposits();
        loadUserBalance();
        
        // ব্যালেন্স আপডেট: প্রতি ১৫ সেকেন্ডে, ট্যাব দেখা না গেলে বন্ধ
        if (window.SBD && SBD.poll) SBD.poll(loadUserBalance, 15000);
        else setInterval(function() { if (!document.hidden) loadUserBalance(); }, 15000);
        
        function updateNotificationBadge() {
            var badges = document.querySelectorAll('.notif-badge');
            for(var i = 0; i < badges.length; i++) {
                badges[i].style.display = 'none';
            }
        }
        // এই ফাংশনটা শুধু ব্যাজ লুকায় — কোনো কিছু আবার দেখায় না।
        // তাই প্রতি ৩ সেকেন্ডে চালানোর দরকার নেই, একবারই যথেষ্ট।
        updateNotificationBadge();
    </script>
